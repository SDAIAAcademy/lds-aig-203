<section>
<h2>اليوم 1: ما لا تبنيه جهتك</h2>
<ol>
<li><p>شركة ناشئة تبيع للمدارس مساعدًا للواجبات. شغّلت نموذجًا مفتوح الأوزان بشروط مثل شروط Gemma على خوادمها، وتتيحه للمدارس عبر واجهة برمجية. أي التزام صار عليها؟</p><ul><li><b>أ.</b> لا شيء، فهي لا تسلّم الأوزان نفسها لأي مدرسة</li><li><b>ب.</b> نشر الرمز المصدري لتطبيقها للمدارس كاملًا</li><li><b>ج.</b> إدراج قيود الاستخدام في اتفاقها مع المدارس</li><li><b>د.</b> طلب ترخيص خاص لأن عدد المدارس المستخدمة كبير</li></ul></li>
<li><p>تحققت جهة توصيل الطرود من توقيع نموذج تحسين المسارات بالمفتاح المنشور في صفحة ناشره، فجاءت النتيجة صحيحة. بطاقة النموذج تذكر نموذجًا أساسيًا لا يُعرف ترخيصه. ماذا تكتب في سجل المنشأ؟</p><ul><li><b>أ.</b> الملفات كما وقّعها حامل المفتاح، وأصل النموذج سؤال مفتوح</li><li><b>ب.</b> النموذج وأصله مرخصان، لأن الناشر وقّع على الحزمة كاملة بمفتاحه</li><li><b>ج.</b> الحزمة غير موثوقة حتى يُعاد التحقق من توقيعها بمفتاح آخر</li><li><b>د.</b> النموذج آمن للاستخدام، والأصل يُراجع لاحقًا عند التقييم الدوري</li></ul></li>
<li><p>مورِّد مساعد مدرسي يرسل شهادة ISO/IEC 27001 صالحة، نطاقها «تشغيل مركز البيانات في جدة». المساعد نفسه يعمل على سحابة مزوّد آخر في الدمام. كيف تقدّر هذا الدليل؟</p><ul><li><b>أ.</b> صلته عالية، فالشهادة صالحة وصادرة باسم المورِّد نفسه</li><li><b>ب.</b> صلته ضعيفة، لأن هذا المعيار لا يناسب أي خدمة ذكاء اصطناعي</li><li><b>ج.</b> كافٍ وحده للأمن، ويكمّله اختبار للجودة قبل التوقيع</li><li><b>د.</b> صلته ضعيفة بالخدمة، فالنطاق لا يشمل موقع تشغيلها</li></ul></li>
<li><p>مجموعة بيانات لصور المستندات بترخيص يسمح بالنسخ والتعديل «لأغراض غير تجارية فقط» مع الإسناد. شركة تأمين تريد تدريب نموذج داخلي يقرأ مستندات المطالبات. ما الحكم؟</p><ul><li><b>أ.</b> يجوز، لأن النموذج داخلي ولن يُوزَّع على أي جهة أخرى</li><li><b>ب.</b> لا يجوز دون إذن منفصل، لأن الاستخدام لغرض تجاري</li><li><b>ج.</b> يجوز مع الإسناد، لأن الإسناد هو الشرط الوحيد في الترخيص</li><li><b>د.</b> يجوز بعد تعديل الصور، لأن المعدَّل عمل جديد</li></ul></li>
<li><p>ترخيص نموذج مفتوح الأوزان (افتراضي) يسمح بالاستخدام التجاري لمن تقل إيراداته السنوية عن حد محدد، ويطلب ترخيصًا خاصًا لمن يتجاوزه. بنك كبير يريد تشغيله داخليًا. ما السؤال الذي يحسم الأمر؟</p><ul><li><b>أ.</b> هل سيتيح البنك النموذج لعملائه عبر واجهة برمجية؟</li><li><b>ب.</b> هل يعرض البنك اسم النموذج الأصلي في وثائقه؟</li><li><b>ج.</b> هل يحتفظ البنك بنسخة من الترخيص مع الأوزان؟</li><li><b>د.</b> هل تتجاوز إيرادات البنك الحد في الترخيص؟</li></ul></li>
<li><p>شركة تضمّن مكتبة بترخيص متساهل من عائلة BSD في تطبيق تبيعه لعملائها نسخةً ثنائية. ما الذي يلزمها؟</p><ul><li><b>أ.</b> نسخ إشعار الحقوق والشروط في وثائق التطبيق</li><li><b>ب.</b> نشر الرمز المصدري لتطبيقها كاملًا مع كل نسخة تبيعها</li><li><b>ج.</b> دفع رسم سنوي لأصحاب المكتبة عن كل نسخة مبيعة</li><li><b>د.</b> طلب إذن مكتوب قبل أي استخدام تجاري</li></ul></li>
<li><p>شروط خدمة نماذج مستضافة تقول: «قد نستخدم المحتوى لتحسين الخدمة ما لم يكن العميل على الخطة المؤسسية مع تفعيل ضوابط البيانات». مستشفى يريد إرسال ملخصات زيارات. ما الخطوة قبل الإرسال؟</p><ul><li><b>أ.</b> الاكتفاء بحذف أسماء المرضى من الملخصات قبل الإرسال</li><li><b>ب.</b> الخطة المؤسسية بضوابط مفعّلة، وتقييم لمخاطر النقل</li><li><b>ج.</b> إرسال الملخصات لأن الخدمة لا تُبقي إلا سجلات قصيرة</li><li><b>د.</b> طلب تعهد بالبريد من المزوّد بعدم استخدام المحتوى</li></ul></li>
<li><p>نزّلت نسخة من نموذج من منصة غير منصة ناشره، وتحققت من توقيعها بمفتاح عام منشور في صفحة النسخة نفسها، فجاءت النتيجة صحيحة. ما الذي ثبت؟</p><ul><li><b>أ.</b> أن النسخة مطابقة لما نشره الناشر الأصلي في صفحته</li><li><b>ب.</b> أن النسخة خالية من رمز ضار يعمل عند التحميل</li><li><b>ج.</b> أن الملفات كما وقّعها حامل مفتاح لا تُعرف هويته</li><li><b>د.</b> أن ترخيص النسخة هو ترخيص النموذج الأصلي نفسه</li></ul></li>
<li><p>ملاحظات الإصدار الأول تنشر بصمة SHA-256 لملف الأوزان. بصمة الملف الذي تشغّله اليوم مختلفة، والإصدار الحالي يقول «تحسينات طفيفة». ماذا تكتب في سجل المنشأ؟</p><ul><li><b>أ.</b> أن الملف تالف أثناء التنزيل ويجب تنزيله من جديد</li><li><b>ب.</b> أن الأوزان تغيرت بين الإصدارين، مع سؤال للناشر</li><li><b>ج.</b> أن البصمة لا تصلح للمقارنة بين إصدارين مختلفين</li><li><b>د.</b> أن التحسين الطفيف لا يستدعي أي تسجيل في السجل</li></ul></li>
<li><p>ولّدت قائمة مكونات CycloneDX لنموذج، فظهرت مجموعتا بيانات بلا ترخيص، لأن البطاقة لا تذكر ترخيصهما. ما الصحيح؟</p><ul><li><b>أ.</b> القائمة ناقصة بسبب خطأ في الأداة، فأعد توليدها</li><li><b>ب.</b> غياب الترخيص في القائمة يعني أن البيانات في الملك العام</li><li><b>ج.</b> الفراغ معلومة: سؤال مفتوح للناشر في سجل المنشأ</li><li><b>د.</b> القائمة لا تخص البيانات، فتجاهل هذين المكونين</li></ul></li>
<li><p>نسخة «أسرع» من نموذج معروف على منصة عامة تطلب تشغيل ملف تحميل خاص بها، وتوقيعها لا يتحقق بمفتاح الناشر الأصلي. ما القرار؟</p><ul><li><b>أ.</b> تُستخدم في بيئة اختبار معزولة ثم تُنقل إلى الإنتاج</li><li><b>ب.</b> تُستخدم إذا لم يكتشف فحص المنصة فيها ملفًا ضارًا</li><li><b>ج.</b> تُستخدم بعد قراءة ملف التحميل والتأكد أنه قصير</li><li><b>د.</b> لا تُستخدم، وتُستخدم النسخة التي يتحقق توقيعها</li></ul></li>
<li><p>مورِّد روبوت محادثة لخدمة العملاء يرسل شهادة ISO/IEC 42001 صالحة، نطاقها «منصة تحليلات الموارد البشرية». كيف تقدّر صلتها بالروبوت؟</p><ul><li><b>أ.</b> عالية، فالشهادة على نظام إدارة الذكاء الاصطناعي نفسه</li><li><b>ب.</b> ضعيفة، فالنطاق منتج آخر غير الروبوت الذي تشتريه</li><li><b>ج.</b> عالية، فالمورِّد نفسه يدير المنتجين بالفريق نفسه</li><li><b>د.</b> متوسطة، فالشهادة صالحة لكن تاريخها قديم</li></ul></li>
<li><p>مورِّد يرسل نتيجة «دقة 96%» من اختبار أجراه فريقه على محادثات اختارها، وحكم عليها فريقه نفسه. كيف تقدّر كفايتها؟</p><ul><li><b>أ.</b> غير كافية: البيانات والتشغيل والحكم عند المورِّد</li><li><b>ب.</b> كافية: النسبة مرتفعة وحجم العينة يبدو معقولًا لخدمة كهذه</li><li><b>ج.</b> كافية إذا أرفق المورِّد أسماء من أجروا الاختبار</li><li><b>د.</b> غير كافية فقط لأن النسبة لا تبلغ مئة في المئة كاملة</li></ul></li>
<li><p>قائمة الأطراف من الباطن لمورِّد خدمة وكلاء تُظهر أن نص المحادثات وأسماء العملاء تُعالَج لدى مزوّد نماذج في منطقة خارج المملكة. ما الخطوة قبل التوقيع؟</p><ul><li><b>أ.</b> لا شيء، فالعقد مع المورِّد وحده لا مع مزوّده الخارجي</li><li><b>ب.</b> طلب شهادة أمن معلومات من المورِّد الأول وحده</li><li><b>ج.</b> تقييم مخاطر النقل، أو التزام بالمعالجة داخل المملكة</li><li><b>د.</b> الاكتفاء بإشعار العملاء بالنقل في سياسة الخصوصية</li></ul></li>
<li><p>يجيب مورِّد في الاستبانة: «نحن معتمدون مقدمَ خدمات ذكاء اصطناعي على منصة حوكمة البيانات الوطنية». ماذا تطلب؟</p><ul><li><b>أ.</b> لا شيء، فالاعتماد الوطني يغني عن بقية الأدلة كلها</li><li><b>ب.</b> شهادة ISO/IEC 42001 بدلًا من الاعتماد الوطني</li><li><b>ج.</b> خطاب من المورِّد يؤكد الجواب نفسه، موقّعًا بختم الشركة</li><li><b>د.</b> اسم المنتج الموسوم وشهادة الاعتماد، ثم التحقق منهما</li></ul></li>
</ol>
</section>
<section>
<h2>اليوم 2: التغيير والخروج والإيقاف</h2>
<ol>
<li><p>مكتبة لقراءة الجداول يريد فريق في جهتك تضمينها في تطبيق يبيعه. رأس بطاقتها يقول MIT، وملف الترخيص في مستودعها نص GPL-3.0. ماذا تسجّل؟</p><ul><li><b>أ.</b> MIT، لأن رأس البطاقة هو ما تعرضه المنصة للجميع أولًا</li><li><b>ب.</b> GPL-3.0 حتى يُستوضح، مع تسجيل التعارض سؤالًا للناشر</li><li><b>ج.</b> لا ترخيص، فالتعارض يبطل الترخيصين معًا</li><li><b>د.</b> الاثنان معًا، ويختار الفريق أيهما يناسب البيع لاحقًا</li></ul></li>
<li><p>مساعد خدمة العملاء في شركة طرود يستدعي نموذجًا باسم مستعار. غيّر المزوّد ما يشير إليه الاسم، فصار المساعد يرفض أسئلة كان يجيب عنها، ولم يعلم أحد إلا من الشكاوى. أي بند كان سيمنع هذا؟</p><ul><li><b>أ.</b> إشعار قبل أي تغيير في السلوك، مع حق الاختبار قبله</li><li><b>ب.</b> مهلة لا تقل عن 60 يومًا قبل إيقاف أي إصدار مثبّت لديه</li><li><b>ج.</b> خصم في رسوم الشهر الذي تكثر فيه شكاوى العملاء</li><li><b>د.</b> تصدير سجلات المحادثات بصيغة مفتوحة عند الإنهاء</li></ul></li>
<li><p>جهة دعم سكني توقف نموذج الأهلية بعد تشغيل بديله. متقدم رُفض بالنموذج القديم قبل شهرين، ويحق له التظلم خلال سنة. ماذا يجب أن يبقى محفوظًا ليُراجع قراره؟</p><ul><li><b>أ.</b> نتيجة القرار في ملف المتقدم وتاريخ صدوره ورقم الطلب</li><li><b>ب.</b> النموذج البديل، لأنه سيعيد تقييم طلب المتقدم</li><li><b>ج.</b> مدخلات القرار وأسبابه، والنموذج بالإصدار الذي أصدره</li><li><b>د.</b> سجلات استدعاء الواجهة التقنية خلال السنة الماضية كاملة</li></ul></li>
<li><p>مزوّد نماذج مستضافة يعطي 14 يومًا إشعارًا قبل إيقاف أي إصدار. إجراء التغيير في جهتك يحتاج 30 يومًا لإعادة التقييم والموافقة. أي بند تكتب؟</p><ul><li><b>أ.</b> بند يلزم المزوّد بإرسال الإشعار بالبريد وبالهاتف معًا</li><li><b>ب.</b> إشعار لا يقل عن مدة إجراء التغيير، مع بقاء الإصدار</li><li><b>ج.</b> بند يطلب خصمًا في السعر عن كل إيقاف يعلنه المزوّد</li><li><b>د.</b> بند يمنع المزوّد من إيقاف أي إصدار طوال مدة العقد</li></ul></li>
<li><p>استخدام عالي الأثر يستدعي نموذجًا باسم مستعار من نوع «latest» يغيّر المزوّد ما يشير إليه دون إشعار. ما الخطر الأول؟</p><ul><li><b>أ.</b> أن يرتفع السعر دون أن تعلم الجهة به في وقته</li><li><b>ب.</b> أن يتوقف الاستخدام فجأة يوم إيقاف الإصدار</li><li><b>ج.</b> أن يتغير السلوك دون إعادة تقييم ولا موافقة</li><li><b>د.</b> أن تفقد الجهة سجلات الاستدعاءات القديمة كلها</li></ul></li>
<li><p>خطة خروج من خدمة مستضافة فيها المحفزات والبديل والخطوات والمالكون. ما الذي ينقصها لتكون قابلة للاختبار؟</p><ul><li><b>أ.</b> قائمة بأسماء البدائل المحتملة في السوق اليوم</li><li><b>ب.</b> موافقة المزوّد الحالي على الخطة كتابيًا</li><li><b>ج.</b> تقدير لتكلفة الانتقال على مدى خمس سنوات</li><li><b>د.</b> تاريخ لاختبارها، ومعيار لنجاح الاختبار</li></ul></li>
<li><p>شروط المزوّد: «تُتاح بيانات العميل للتصدير بصيغتنا الخاصة سبعة أيام بعد الإنهاء، ثم تُحذف». ما التعديل الأهم في بند الخروج؟</p><ul><li><b>أ.</b> صيغة قابلة للاستخدام ومدة كافية للتصدير وتأكيد مكتوب للمحو</li><li><b>ب.</b> إطالة مدة العقد حتى لا يحتاج العميل إلى الخروج أبدًا</li><li><b>ج.</b> إلزام المزوّد بالاحتفاظ بالبيانات لديه دون أي حد زمني</li><li><b>د.</b> حذف البيانات فور الإنهاء دون أي مدة متاحة للتصدير</li></ul></li>
<li><p>قبل إيقاف نموذج، تُظهر سجلات الاستدعاء مستدعيًا لا يرد في سجل التبعيات: جدول بيانات في فرع يستدعي الواجهة بضع مرات يوميًا. ما الخطوة؟</p><ul><li><b>أ.</b> إغلاق الواجهة في الموعد، فمن لم يُسجَّل لا يُعتد به</li><li><b>ب.</b> تحديد مالكه، ونقله إلى البديل، وتسجيله قبل الإغلاق</li><li><b>ج.</b> إبقاء الواجهة القديمة مفتوحة لهذا الفرع وحده بلا موعد</li><li><b>د.</b> إلغاء مفتاحه بصمت ومراقبة من يشتكي بعد ذلك</li></ul></li>
<li><p>جدول الاحتفاظ في جهة يحفظ قرارات الائتمان عشر سنوات بعد إغلاق التمويل. النموذج الموقوف أصدر آلاف القرارات. إلى متى يُحفظ النموذج ووثائقه؟</p><ul><li><b>أ.</b> حتى انتهاء فترة التراجع إلى النموذج القديم</li><li><b>ب.</b> سنة واحدة بعد الإيقاف، ثم تكفي سجلات القرارات</li><li><b>ج.</b> حتى يوافق المورِّد الذي بناه على حذفه</li><li><b>د.</b> ما دام أي قرار صدر به محفوظًا قابلًا للتظلم</li></ul></li>
<li><p>في التشغيل الموازي، النموذج البديل يقبل نسبة أقل بكثير من طلبات قطاع واحد. الخطة جاهزة من كل وجه آخر. ماذا تكتب في المخاطر المتبقية؟</p><ul><li><b>أ.</b> لا شيء، فالبديل أدق في المتوسط من النموذج القديم</li><li><b>ب.</b> إيقاف الخطة كلها حتى يتساوى القبول في كل القطاعات</li><li><b>ج.</b> الفرق ومالكًا يقبله أو يعالجه، ومراقبة بعد الإيقاف</li><li><b>د.</b> ملاحظة للفريق الفني يراجعها في الإصدار القادم من النموذج</li></ul></li>
<li><p>مجلس التغيير يسأل: «ماذا لو ساء أداء البديل في الأسبوع الثاني؟». أي جواب يقبله المجلس؟</p><ul><li><b>أ.</b> نعيد تدريب البديل بسرعة على بيانات الأسبوعين الأولين</li><li><b>ب.</b> نُبقي القديم جاهزًا مدة محددة، بمعيار عودة وصاحب قرار</li><li><b>ج.</b> نعود إلى القديم متى طلب أي مستخدم ذلك</li><li><b>د.</b> لا حاجة إلى خطة، فالتشغيل الموازي أثبت البديل بما يكفي</li></ul></li>
</ol>
